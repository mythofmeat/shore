[package]
name = "shore-daemon"
version.workspace = true
publish.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Persistent AI character engine daemon — long-running process behind the Silvershore chat protocol."

[dependencies]
shore-common = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.9"
dashmap = { workspace = true }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
sha2 = "0.10"
base64 = "0.22.1"
tempfile = "3"
shell-words = "1.1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
fast_image_resize = { version = "6", features = ["image"] }
libc = { workspace = true }
notify = "8.2"

# Absorbed from the former shore-llm / shore-ledger / shore-call-store /
# shore-mcp-client / shore-swp-server crates.
async-trait = { workspace = true }
fs2 = "0.4"
futures-util = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
zstd = { workspace = true }

# Exec-tool sandbox (Linux only): Landlock for filesystem confinement and
# seccomp for syscall cuts. Other platforms fall back to denylist-only exec.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
insta = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
