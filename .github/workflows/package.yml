name: Build and publish Arch packages

# One `v<version>` tag releases the whole suite: every package is built from
# the same commit at the same workspace version. The jobs are chained with
# `needs:` on purpose — each one downloads the current repo-arch database,
# adds its package, and re-uploads, so parallel jobs would clobber each
# other's db entries. Serializing also lets later jobs reuse the cargo
# target-dir cache the first job saved for this sha.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-daemon:
    permissions:
      contents: write
    uses: mythofmeat/repo-arch/.github/workflows/publish-arch-rust.yml@main
    with:
      pkgbuild_dir: contrib/shore-daemon
      # bun builds the LLM sidecar.
      extra_pacman_packages: "bun"
    secrets: inherit

  publish-cli:
    needs: publish-daemon
    permissions:
      contents: write
    uses: mythofmeat/repo-arch/.github/workflows/publish-arch-rust.yml@main
    with:
      pkgbuild_dir: contrib/shore-cli
    secrets: inherit

  publish-tui:
    needs: publish-cli
    permissions:
      contents: write
    uses: mythofmeat/repo-arch/.github/workflows/publish-arch-rust.yml@main
    with:
      pkgbuild_dir: contrib/shore-tui
    secrets: inherit

  publish-matrix:
    needs: publish-tui
    permissions:
      contents: write
    uses: mythofmeat/repo-arch/.github/workflows/publish-arch-rust.yml@main
    with:
      pkgbuild_dir: contrib/shore-matrix
      extra_pacman_packages: "alsa-lib"
    secrets: inherit
