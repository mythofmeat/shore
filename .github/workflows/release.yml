name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF."
            exit 1
          fi
          versions() {
            sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\(.*\)"$/\1/p' client/Cargo.toml
            sed -n '/^name = "shore-\(cli\|common\)"$/{n;s/^version = "\(.*\)"$/\1/p}' client/Cargo.lock
            sed -n 's/^  "version": "\(.*\)",$/\1/p' daemon/package.json desktop/package.json
            sed -n 's/^pkgver=//p' contrib/arch/PKGBUILD
            sed -n 's/^Version: *//p' contrib/fedora/shore.spec
          }
          current=$(versions | sort -u)
          if [ "$(printf '%s\n' "$current" | wc -l)" -ne 1 ]; then
            echo "::error::The version files disagree: $(versions | tr '\n' ' ')"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *)
              echo "::error::Bump must be patch, minor or major, not '$BUMP'."
              exit 1
              ;;
          esac
          if git ls-remote --exit-code --heads origin "release/v$version" >/dev/null; then
            echo "::error::release/v$version is left over from an earlier release run; close its pull request if one is open, delete the branch and retry."
            exit 1
          fi
          sed -i "/^\[workspace\.package\]$/,/^\[/s/^version = \".*\"$/version = \"$version\"/" client/Cargo.toml
          sed -i "/^name = \"shore-\(cli\|common\)\"$/{n;s/^version = .*/version = \"$version\"/}" client/Cargo.lock
          sed -i "s/^  \"version\": \".*\",$/  \"version\": \"$version\",/" daemon/package.json desktop/package.json
          sed -i -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" contrib/arch/PKGBUILD
          sed -i -e "s/^\(Version: *\).*/\1$version/" -e "s/^\(Release: *\)[0-9]*/\11/" contrib/fedora/shore.spec
          if [ "$(versions | sort -u)" != "$version" ]; then
            echo "::error::Not every version file moved to $version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$version"
          git commit -am "chore(release): v$version"
          git push origin "release/v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v${{ needs.version.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run app:macos
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: zip
        run: |
          sha=$(shasum -a 256 "out/desktop/Shore-$VERSION-arm64.zip")
          echo "sha256=${sha%% *}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/desktop/Shore-${{ needs.version.outputs.version }}-arm64.zip

  merge:
    needs: [version, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.merge.outputs.tag }}
      revision: ${{ steps.merge.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v${{ needs.version.outputs.version }}
      - env:
          GH_TOKEN: ${{ secrets.DEPS_PR_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$(gh pr list --head "release/v$VERSION" --base main --json number --jq '.[].number')" ]; then
            exit 0
          fi
          gh pr create --base main --head "release/v$VERSION" --title "chore(release): v$VERSION" \
            --body "Opened by the release workflow, which merges it once verify passes, then tags the merge and publishes v$VERSION."
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 30); do
            run=$(gh run list --workflow verify.yml --commit "$sha" --event pull_request --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::verify never started on $sha."
            exit 1
          fi
          if ! gh run watch "$run" --exit-status >/dev/null; then
            echo "::error::verify failed on the release pull request; close it and delete release/v$VERSION before retrying."
            exit 1
          fi
          gh pr merge "release/v$VERSION" --squash
          merged=$(gh pr view "release/v$VERSION" --json mergeCommit --jq .mergeCommit.oid)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$merged" >/dev/null
          echo "tag=v$VERSION" >>"$GITHUB_OUTPUT"
          echo "revision=$merged" >>"$GITHUB_OUTPUT"
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v$VERSION" >/dev/null; then
            echo "::warning::v$VERSION is merged and tagged, but release/v$VERSION couldn't be deleted."
          fi

  packages:
    needs: merge
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.merge.outputs.tag }}

  release:
    needs: [merge, packages, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$TAG" assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.merge.outputs.tag }}

  tap:
    needs: [version, macos, merge, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mythofmeat/homebrew-shore
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ needs.merge.outputs.revision }}
          SHA256: ${{ needs.macos.outputs.sha256 }}
        run: |
          if ! [[ $REVISION =~ ^[0-9a-f]{40}$ && $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::v$VERSION's commit ($REVISION) or Shore.app's checksum ($SHA256) is missing or malformed."
            exit 1
          fi
          sed -i -e "s/^      tag:      \"v.*\",$/      tag:      \"v$VERSION\",/" \
            -e "s/^      revision: \"[0-9a-f]*\"$/      revision: \"$REVISION\"/" Formula/shore.rb
          sed -i -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" Casks/shore-desktop.rb
          if ! grep -qx "      tag:      \"v$VERSION\"," Formula/shore.rb ||
            ! grep -qx "      revision: \"$REVISION\"" Formula/shore.rb ||
            ! grep -qx "  version \"$VERSION\"" Casks/shore-desktop.rb ||
            ! grep -qx "  sha256 \"$SHA256\"" Casks/shore-desktop.rb; then
            echo "::error::The tap's formula and cask didn't all move to v$VERSION."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): shore v$VERSION"
          git push
