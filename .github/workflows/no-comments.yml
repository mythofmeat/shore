name: no comments

on:
  push:
  pull_request:

jobs:
  no-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: daemon
      - run: bun run lint:comments
        working-directory: daemon
