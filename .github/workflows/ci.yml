name: CI

# Everything here is self-contained on purpose. The `check` job used to call a
# reusable workflow from the private `mythofmeat/repo-arch` repo. Once that
# repo's Actions access policy became `none`, the `uses:` reference was
# unresolvable and GitHub failed the ENTIRE workflow at validation time — so
# the self-contained `docs` job never ran either and the repo silently had no
# Rust CI at all, on PRs or on main. Keep these jobs inline rather than
# reintroducing a cross-repo dependency that can fail the same way.

on:
  push:
    branches:
      - main
      - staging
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold build-essential pkg-config libasound2-dev protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # The LLM sidecar is shipped code — install.sh builds it and installs
  # shore-llm-sidecar alongside the Rust binaries — but nothing in CI exercised
  # it until now. That gap is why a bug which silently dropped every image
  # attachment on non-Anthropic providers reached users while the sidecar's own
  # test suite sat green the entire time.
  sidecar:
    name: Sidecar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/llm-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Not `--frozen-lockfile`: the root .gitignore has `*.lock`, so bun.lock
      # is untracked and there is nothing to freeze against. install.sh takes
      # the same unpinned approach (`bun install && bun update`).
      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Neither `cargo check` nor `cargo clippy` resolves intra-doc links, so broken
  # ones only surface under rustdoc.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev protobuf-compiler mold clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
