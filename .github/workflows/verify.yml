name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: rustup update stable --no-self-update
      - id: rust
        run: echo "version=$(rustc +stable --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: patch-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: codex-apply-patch-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('daemon/vendor/codex-apply-patch/**', 'daemon/scripts/build_patch.ts') }}
      - run: bun run build:patch
      - if: steps.patch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.patch-cache.outputs.cache-primary-key }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:comments
      - run: bun run lint:citations
      - run: bun run lint:test-env
      - run: bun run typecheck
      - run: bun run browser:check
      - run: bun run build:daemon
      - run: bun test
      - name: tools run as each character's own user
        run: scripts/isolation_tests.sh
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: out/issue-214/playwright
          if-no-files-found: ignore
      - run: bun run mutate --stale
      - run: bun run rerecord:check

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo test --workspace
      - name: daemon wire types and schemas are current
        run: |
          if [ -n "$(git status --porcelain -- ../daemon)" ]; then
            echo "::error title=stale wire types::cargo test regenerated the wire types and schemas it exports to daemon/. Run cargo test in client/ and commit what changes there."
            git status --short -- ../daemon
            git --no-pager diff -- ../daemon | head -n 200
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
