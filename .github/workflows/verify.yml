name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: rustup update stable --no-self-update
      - id: rust
        run: echo "version=$(rustc +stable --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: patch-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: codex-apply-patch-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('daemon/vendor/codex-apply-patch/**', 'daemon/scripts/build_patch.ts') }}
      - run: bun run build:patch
      - if: steps.patch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.patch-cache.outputs.cache-primary-key }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:comments
      - run: bun run lint:test-env
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: bun run mutate --list > /dev/null
      - run: bun run mutate --client --list > /dev/null
      - run: bun run typecheck
      - run: bun run browser:check
      - run: bun run build:daemon
      - run: bun test
      - name: tools run as each character's own user
        run: scripts/isolation_tests.sh
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bunx playwright test
      - name: every mutant on a changed daemon line fails a test
        if: github.event_name == 'pull_request'
        run: bun run mutate --diff=HEAD^1 --workers=4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: out/issue-214/playwright
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: mythofmeat/homebrew-shore
          path: tap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run app:macos
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          zip="$GITHUB_WORKSPACE/out/desktop/Shore-$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/package.json)-arm64.zip"
          sed -i '' -e "s|^  sha256 \".*\"$|  sha256 \"$(shasum -a 256 "$zip" | cut -d' ' -f1)\"|" -e "s|^  url \".*\"$|  url \"file://$zip\"|" tap/Casks/shore-desktop.rb
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE/tap" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-shore"
      - run: brew install --cask mythofmeat/shore/shore-desktop
      - name: Shore.app isn't quarantined
        run: |
          attributes=$(xattr -lr /Applications/Shore.app)
          if grep -q com.apple.quarantine <<<"$attributes"; then
            echo "::error::macOS would ask to approve Shore.app: the cask left the quarantine flag on it."
            exit 1
          fi
      - run: bun install --frozen-lockfile
        working-directory: daemon
      - run: bun run test:e2e
        working-directory: desktop
        env:
          SHORE_DESKTOP_ELECTRON: /Applications/Shore.app/Contents/MacOS/Shore

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo test --workspace
      - name: daemon wire types and schemas are current
        run: |
          if [ -n "$(git status --porcelain -- ../daemon)" ]; then
            echo "::error title=stale wire types::cargo test regenerated the wire types and schemas it exports to daemon/. Run cargo test in client/ and commit what changes there."
            git status --short -- ../daemon
            git --no-pager diff -- ../daemon | head -n 200
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: every mutant on a changed client line fails a test
        if: github.event_name == 'pull_request'
        run: bun ../daemon/scripts/mutate_client.ts --diff=HEAD^1 --workers=2
