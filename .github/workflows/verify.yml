name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: rustup update stable --no-self-update
      - id: rust
        run: echo "version=$(rustc +stable --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: patch-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: codex-apply-patch-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('daemon/vendor/codex-apply-patch/**', 'daemon/scripts/build_patch.ts') }}
      - run: bun run build:patch
      - if: steps.patch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/shore/codex-apply-patch
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.patch-cache.outputs.cache-primary-key }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:comments
      - run: bun run lint:citations
      - run: bun run lint:test-env
      - run: bun run typecheck
      - run: bun run browser:check
      - run: bun run build:daemon
      - run: bun test
      - run: bun run mutate --stale
      - run: bun run rerecord:check

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      # The formula builds the release tag it names from GitHub, so here that tag names this checkout and the
      # formula clones it from disk instead.
      - run: |
          git tag --force "$(sed -n 's/^      tag: "\(v.*\)"$/\1/p' HomebrewFormula/shore-desktop.rb)"
          sed -i '' "s|^  url \"https://github.com/mythofmeat/shore.git\",$|  url \"file://$GITHUB_WORKSPACE\", using: :git,|" HomebrewFormula/shore-desktop.rb
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-shore"
      - run: brew install mythofmeat/shore/shore-desktop
      - run: brew test mythofmeat/shore/shore-desktop
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run test:e2e
        working-directory: desktop
        env:
          SHORE_DESKTOP_ELECTRON: /opt/homebrew/opt/shore-desktop/Shore.app/Contents/MacOS/Shore

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo test --workspace
      - name: daemon wire types and schemas are current
        run: |
          if [ -n "$(git status --porcelain -- ../daemon)" ]; then
            echo "::error title=stale wire types::cargo test regenerated the wire types and schemas it exports to daemon/. Run cargo test in client/ and commit what changes there."
            git status --short -- ../daemon
            git --no-pager diff -- ../daemon | head -n 200
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  homebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      # brew style and audit only apply the formula rules to a tapped formula, so the checkout is linked in as the mythofmeat/shore tap.
      - run: |
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-shore"
      - run: brew style mythofmeat/shore/shore mythofmeat/shore/shore-desktop
      - run: brew audit --strict mythofmeat/shore/shore mythofmeat/shore/shore-desktop
