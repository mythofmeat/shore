name: verify Shore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:comments
      - run: bun run lint:citations
      - run: bun run typecheck
      - run: bun test
      - run: bun run mutate --stale
      - run: bun run rerecord:check
      - run: bun run inventory:check
      - run: bun run inventory:generate
      - run: |
          git diff --exit-code -- ../docs/capabilities/daemon.generated.json
          test -z "$(git ls-files --others --exclude-standard -- ../docs/capabilities/daemon.generated.json)"
      - run: bun run build

  client:
    name: Rust and generated protocol verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test -p shore-common --lib export_bindings --locked
      - run: cargo test -p shore-common --lib export_operation_schemas --locked
      - run: cargo test -p shore-cli export_capability_inventory --locked -- --ignored
      - run: |
          git diff --exit-code -- ../daemon/src/protocol ../daemon/src/operations/schemas.generated.json ../docs/capabilities/terminal.generated.json
          test -z "$(git ls-files --others --exclude-standard -- ../daemon/src/protocol ../daemon/src/operations/schemas.generated.json ../docs/capabilities/terminal.generated.json)"
