name: update dependencies

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      number: ${{ steps.pr.outputs.pull-request-number }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun --version > daemon/.bun-version
      - run: rustup update stable --no-self-update
      - run: cargo install cargo-edit --locked
      - run: bun update --latest
        working-directory: daemon
      - run: cargo upgrade --incompatible && cargo update
        working-directory: client
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPS_PR_TOKEN }}
          branch: deps/weekly
          delete-branch: true
          commit-message: "chore(deps): update"
          title: "chore(deps): update"
          body: |
            Bun, every daemon package and every client crate at their latest versions, majors included.
            The weekly workflow merges this once every check on it passes, then cuts a patch release. The nightly mutation pass covers it once it is on main.

  merge:
    needs: update
    if: needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.update.outputs.number }}
          SHA: ${{ needs.update.outputs.sha }}
        run: |
          rollup() { gh pr view "$PR" --json statusCheckRollup --jq "$1"; }
          for _ in $(seq 200); do
            if [ "$(rollup '.statusCheckRollup | length')" -gt 0 ] && [ "$(rollup '[.statusCheckRollup[] | select(.status != "COMPLETED")] | length')" -eq 0 ]; then
              break
            fi
            sleep 30
          done
          failed=$(rollup '[.statusCheckRollup[] | select(.status != "COMPLETED" or (.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL")) | .name] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::#$PR stays open and nothing is released: $failed did not pass."
            exit 1
          fi
          if ! gh pr merge "$PR" --squash --match-head-commit "$SHA"; then
            echo "::error::#$PR could not be merged as $SHA; if main moved, update the branch and merge it by hand."
            exit 1
          fi
          gh workflow run release.yml --ref main -f bump=patch
