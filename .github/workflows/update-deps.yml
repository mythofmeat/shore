name: update dependencies

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun --version > daemon/.bun-version
      - run: rustup update stable --no-self-update
      - run: cargo install cargo-edit --locked
      - run: bun update --latest
        working-directory: daemon
      - run: cargo upgrade --incompatible && cargo update
        working-directory: client
      # The generated files are committed, and verify fails the pull request if they are stale.
      - run: cargo test -p shore-common export
        working-directory: client
      - run: bun run browser:generate && bun run browser:build
        working-directory: daemon
      # Pull requests opened with the default GITHUB_TOKEN don't trigger other workflows, so verify
      # would never run on this one.
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPS_PR_TOKEN }}
          branch: deps/weekly
          delete-branch: true
          commit-message: "chore(deps): update"
          title: "chore(deps): update"
          body: |
            Bun, every daemon package and every client crate at their latest versions, majors included,
            with the generated files they change. Merging this doesn't cut a release.
