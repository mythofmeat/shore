services:
  shore:
    container_name: shore
    build:
      context: git@github.com:mythofmeat/shore#main
    image: shore-test:latest
    init: true
    # user: "1000:1000"
    volumes:
      - ./config:/config
      - ./workspace:/config/characters
      - ./data:/data
      - ./cache:/cache
    tmpfs:
      - /tmp
    ports:
      - 1112:1112

    restart: unless-stopped
