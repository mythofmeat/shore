# Runs the Shore daemon in Docker, from a checkout of this repository:
#
#   mkdir -p config workspace          # create these yourself, or Docker creates them owned by root
#   docker compose up -d --build
#   docker compose run --rm shore      # the terminal client, connected to the daemon below
#
# The browser client is at http://localhost:7340. Sign in with the token in
# config/token, then sign in other devices from Settings › Devices.
#
# On first start the daemon writes config/config.toml and config/token. Put
# provider keys in config/.env (ANTHROPIC_API_KEY=...) and each character's
# SOUL.md in workspace/<name>/.
#
# A character's tools (bash, read, edit, apply_patch) run as the daemon's
# user unless the character has a user of its own. Then they cannot open
# config/, the data and cache volumes, Claude Code's login or other
# characters' files. For a character named ada:
#
#   1. Add ada:2001 to SHORE_CHARACTER_USERS in .env (space-separated
#      name:uid pairs) and rebuild. The image creates the user.
#   2. Put tools.user = "ada" in config/characters/ada/config.toml, or in
#      config/config.toml to give every character that one user.
#   3. Give ada a home that survives the container: a volume at /home/ada,
#      as for home below.
#   4. On the host, give workspace/ada to that uid and the daemon's group,
#      which may read it but not write it:
#        mkdir -p workspace/ada
#        sudo chown -R 2001:1000 workspace/ada && sudo chmod 2750 workspace/ada
#
# Setting tools.pass_env = ["NAME"] passes the daemon's NAME variable to
# characters with their own user; they get no other variable of the daemon's.
#
# To keep the deployment outside the checkout, copy this file somewhere else
# and build from git instead, with context: https://github.com/mythofmeat/shore.git#main
#
# The same daemon without compose:
#
#   docker build -f daemon/Dockerfile -t shore-daemon .
#   docker run -d --name shore-daemon --stop-timeout 1800 \
#     -p 127.0.0.1:7320:7320 -p 127.0.0.1:7340:7340 \
#     -v "$PWD/config:/config" -v "$PWD/workspace:/workspace" \
#     -v shore-data:/data -v shore-cache:/cache -v shore-home:/home/app \
#     --read-only --tmpfs /tmp:exec --security-opt no-new-privileges \
#     --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL \
#     shore-daemon

services:
  shore-daemon:
    build:
      context: .
      dockerfile: daemon/Dockerfile
      args:
        # The bind mounts must be writable by the daemon's user. If your UID or
        # GID is not 1000, set SHORE_UID and SHORE_GID in .env.
        USER_UID: ${SHORE_UID:-1000}
        USER_GID: ${SHORE_GID:-1000}
        # Users for characters' tools, as described at the top.
        CHARACTER_USERS: ${SHORE_CHARACTER_USERS:-}
        # Sets /etc/localtime in the image. Keep it the same as TZ below.
        TZ: ${TZ:-UTC}
    restart: unless-stopped
    # On stop the daemon finishes replies and heartbeats already running, for
    # up to daemon.shutdown_grace (29m by default). Keep this a little longer.
    stop_grace_period: 30m
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Loopback only. Publishing them wider, e.g. "7340:7340", lets anyone who
      # can reach the port and holds config/token drive the daemon.
      - "127.0.0.1:7320:7320"
      # The browser client.
      - "127.0.0.1:7340:7340"
    volumes:
      - ./config:/config
      - ./workspace:/workspace
      - data:/data
      - cache:/cache
      # The daemon's home: Claude Code's login unless CLAUDE_CONFIG_DIR
      # points elsewhere, and, for characters without a user of their own,
      # tool caches and what they install with pip --user or uv.
      - home:/home/app
      # A character with its own user keeps those in its own home:
      # - ada-home:/home/ada
    # The bash tool runs whatever the model asks for inside this container.
    # The container starts as root only to hand the daemon these three
    # capabilities: SETUID and SETGID to run each character's tools as its
    # user, KILL to stop them. Those tools get none, and nothing in the
    # container can gain privileges or write anywhere but the volumes and /tmp.
    read_only: true
    tmpfs:
      # exec: installers such as cargo and pip build and run programs here.
      - /tmp:exec
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

  shore:
    profiles: [cli]
    build:
      context: .
      dockerfile: client/shore-cli/Dockerfile
    environment:
      SHORE_ADDR: shore-daemon:7320
      SHORE_CONFIG_DIR: /config
    volumes:
      # For the token the daemon wrote there.
      - ./config:/config:ro
    depends_on:
      - shore-daemon
    stdin_open: true
    tty: true

volumes:
  data:
  cache:
  home:
  # ada-home:
