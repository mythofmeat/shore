services:
  shore-daemon:
    build:
      context: .
      dockerfile: daemon/Dockerfile
      args:
        USER_UID: ${SHORE_UID:-1000}
        USER_GID: ${SHORE_GID:-1000}
        CHARACTER_USERS: ${SHORE_CHARACTER_USERS:-}
        TZ: ${TZ:-UTC}
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:7320:7320"
      - "127.0.0.1:7340:7340"
    volumes:
      - ./config:/config
      - ./workspace:/workspace
      - data:/data
      - cache:/cache
      - home:/home/app
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

  shore:
    profiles: [cli]
    build:
      context: .
      dockerfile: client/shore-cli/Dockerfile
    environment:
      SHORE_ADDR: shore-daemon:7320
      SHORE_CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      - shore-daemon
    stdin_open: true
    tty: true

volumes:
  data:
  cache:
  home:
